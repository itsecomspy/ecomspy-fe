<!DOCTYPE html>
<html lang="en">
  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link

    <meta

    <meta
      property="og:title"
      content="Ecom Spy - Discover the latest ecommerce trends."
    />
    <meta property="og:type" content="website" />

      property="og:description"

    />

	================================================== -->

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="Ecom Spy" />
    <meta name="twitter:domain" content="https://tryecomspy.com" />
    <meta
      name="twitter:title"
      content="Ecom Spy - Discover the latest ecommerce trends."
    />

      name="twitter:description"
      content="Discover the newest trends in ecommerce, search emerging markets, and find product insights to stay ahead of the competition"
    />

  <body>
    <form name="support" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="email" />
      <input type="text" name="message" />
    </form>
    <form name="feedback" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="email" />
      <input type="text" name="message" />
      <input type="file" id="file" name="file" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
